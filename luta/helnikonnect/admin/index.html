<!DOCTYPE html>
<html lang="en" data-app-name="HelpKonnect Admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — HelpKonnect</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

    <!-- Login screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-brand" id="login-brand" role="button" tabindex="0">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#0ea5e9"/>
                    <path d="M10 12h3v13h-3zM19 12h3v13h-3zM7 9h4v16H7zM21 9h4v16h-4z" fill="#0b2a4a"/>
                </svg>
                <span>HelpKonnect</span>
            </div>
            <h1>Admin Login</h1>
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="login-email">Email address</label>
                    <input class="form-input" type="email" id="login-email" placeholder="admin@helpkonnect.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input class="form-input" type="password" id="login-password" placeholder="Password" required>
                </div>
                <div id="login-error" class="field-error" style="display:none"></div>
                <button class="btn btn-primary" type="submit" id="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Dashboard shell -->
    <div id="app-shell" class="app-shell" style="display:none">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand" id="sidebar-brand" role="button" tabindex="0">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#0ea5e9"/>
                    <path d="M10 12h3v13h-3zM19 12h3v13h-3zM7 9h4v16H7zM21 9h4v16h-4z" fill="#0b2a4a"/>
                </svg>
                <span>HNC Admin</span>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="#" class="sidebar-link active" data-section="dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
                    Dashboard
                </a>
                <a href="#" class="sidebar-link" data-section="applications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                    Applications
                </a>
                <a href="#" class="sidebar-link" data-section="drawings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                    Drawings
                </a>
                <a href="#" class="sidebar-link" data-section="faqs">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
                    FAQs
                </a>
                <a href="#" class="sidebar-link" data-section="documents">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
                    Documents
                </a>
                <a href="#" class="sidebar-link" data-section="announcements">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
                    Announcements
                </a>
                <a href="#" class="sidebar-link" data-section="settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-ghost" id="logout-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Sign Out
                </button>
            </div>
        </aside>
        <main class="main-content" id="main-content">
            <div class="topbar">
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <h2 class="page-title" id="page-title">Dashboard</h2>
                <div class="topbar-user" id="topbar-user"></div>
            </div>
            <div class="content-area" id="content-area"></div>
        </main>
    </div>

    <!-- Modal overlay -->
    <div id="modal-overlay" class="modal-overlay" style="display:none">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
