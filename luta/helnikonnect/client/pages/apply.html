<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply — HelpKonnect</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>form.form{display:grid;gap:18px}.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(max-width:640px){.form-row{grid-template-columns:1fr}}</style>
</head>
<body>
    <div class="toast-wrap" id="toast-wrap"></div>
    <header class="site-nav"><div class="container nav-inner">
        <a href="../index.html" class="brand" data-route="home"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0ea5e9"/><path d="M10 12h3v13h-3zM19 12h3v13h-3zM7 9h4v16H7zM21 9h4v16h-4z" fill="#0b2a4a"/></svg>HelpKonnect</a>
        <nav class="nav-links"><a href="../index.html" data-route="home" data-i18n="home">Home</a><a href="../index.html#services" data-route="services" data-i18n="services">Services</a><a href="documents.html" data-route="docs" data-i18n="docs_library">Documents</a><a href="faq.html" data-route="faq" data-i18n="faq">FAQ</a><a href="../index.html#contact" data-route="contact" data-i18n="contact">Contact</a></nav>
        <div class="nav-actions">
            <div class="lang-switch"><button data-lang-btn="en">EN</button><button data-lang-btn="sw">SW</button></div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        </div>
    </div></header>

    <main class="section">
        <div class="container" style="max-width:760px">
            <div class="section-head">
                <span class="tagline" data-i18n="apply_now">Apply Now</span>
                <h1>New Application</h1>
                <p class="muted">Complete the details below. You will receive a reference number to track your request.</p>
            </div>

            <form class="card form" id="apply-form" novalidate>
                <h3 style="margin:0">Applicant Information</h3>
                <div class="form-row">
                    <div class="form-group"><label>Full name <span class="req">*</span></label><input class="form-input" name="full_name" required></div>
                    <div class="form-group"><label>Phone <span class="req">*</span></label><input class="form-input" name="phone" placeholder="+255XXXXXXXXX" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Email</label><input class="form-input" name="email" type="email"></div>
                    <div class="form-group"><label>Applicant type</label>
                        <select class="form-select" name="applicant_type"><option>Resident</option><option>Electrician</option><option>Electrical Technician</option><option>Contractor</option><option>Business</option><option>Other</option></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Region</label><input class="form-input" name="region"></div>
                    <div class="form-group"><label>District</label><input class="form-input" name="district"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Ward</label><input class="form-input" name="ward"></div>
                    <div class="form-group"><label>Street / Village</label><input class="form-input" name="street"></div>
                </div>

                <h3 style="margin:0;padding-top:8px">Application Information</h3>
                <div class="form-row">
                    <div class="form-group"><label>Application type <span class="req">*</span></label>
                        <select class="form-select" name="application_type_id" id="app-type" required><option value="">Loading types...</option></select>
                    </div>
                    <div class="form-group"><label>Service required</label><input class="form-input" name="service_required"></div>
                </div>
                <div class="form-group"><label>Description</label><textarea class="form-textarea" name="description"></textarea></div>
                <div class="form-group"><label>Location</label><input class="form-input" name="location"></div>
                <div class="form-row">
                    <div class="form-group"><label>Preferred contact</label>
                        <select class="form-select" name="preferred_contact"><option>Phone</option><option>WhatsApp</option><option>Email</option></select>
                    </div>
                    <div class="form-group"><label>Additional notes</label><input class="form-input" name="additional_notes"></div>
                </div>

                <div style="display:flex;gap:12px;align-items:center">
                    <button class="btn btn-primary" id="submit-app" type="submit">Submit Application</button>
                    <span class="muted" id="form-status" style="font-size:.85rem"></span>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/i18n.js"></script>
    <script>
        const API = window.HNC, L = window.HNC_LANG;
        (async function(){
            try{
                const res = await API.request('application-types',{auth:false});
                const sel = document.getElementById('app-type');
                const items = res.data||[];
                sel.innerHTML = items.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
            }catch(e){
                document.getElementById('app-type').innerHTML='<option value="">Unable to load types</option>';
            }
        })();
        function status(m){document.getElementById('form-status').textContent=m;}
        document.getElementById('apply-form').addEventListener('submit', async function(e){
            e.preventDefault();
            document.getElementById('submit-app').disabled = true;
            status(L.t('loading'));
            const fd = new FormData(this); const body = {};
            for(const [k,v] of fd.entries()) body[k]=v;
            try{
                const res = await API.request('applications',{method:'POST',body});
                status('Submitted. Reference: '+res.data.reference_no);
            }catch(err){
                status(err.message);
                toast(err.message,'error');
                document.getElementById('submit-app').disabled=false;
            }
        });
        function toast(m,t){const w=document.getElementById('toast-wrap');const n=document.createElement('div');n.className='toast toast--'+(t||'success');n.textContent=m;w.appendChild(n);setTimeout(()=>n.classList.add('toast--show'),20);setTimeout(()=>{n.classList.remove('toast--show');setTimeout(()=>n.remove(),300);},3200);}
        document.querySelectorAll('[data-lang-btn]').forEach(b=>b.addEventListener('click',()=>L.setLang(b.getAttribute('data-lang-btn'))));
        document.getElementById('nav-toggle').addEventListener('click',()=>document.querySelector('.nav-links').classList.toggle('open'));
    </script>
</body>
</html>
