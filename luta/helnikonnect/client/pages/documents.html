<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents — HelpKonnect</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>.doc-row{display:flex;justify-content:space-between;align-items:center;gap:16px}@media(max-width:640px){.doc-row{flex-direction:column;align-items:flex-start}}</style>
</head>
<body>
    <div class="toast-wrap" id="toast-wrap"></div>
    <header class="site-nav"><div class="container nav-inner">
        <a href="../index.html" class="brand" data-route="home"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0ea5e9"/><path d="M10 12h3v13h-3zM19 12h3v13h-3zM7 9h4v16H7zM21 9h4v16h-4z" fill="#0b2a4a"/></svg>HelpKonnect</a>
        <nav class="nav-links"><a href="../index.html" data-route="home" data-i18n="home">Home</a><a href="../index.html#services" data-route="services" data-i18n="services">Services</a><a href="documents.html" data-route="docs" class="active" data-i18n="docs_library">Documents</a><a href="faq.html" data-route="faq" data-i18n="faq">FAQ</a><a href="../index.html#contact" data-route="contact" data-i18n="contact">Contact</a></nav>
        <div class="nav-actions">
            <div class="search-wrap"><input id="doc-search" type="search" data-i18n-placeholder="search" placeholder="Search..." aria-label="Search"></div>
            <div class="lang-switch"><button data-lang-btn="en">EN</button><button data-lang-btn="sw">SW</button></div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        </div>
    </div></header>

    <main class="section">
        <div class="container">
            <div class="section-head">
                <span class="tagline" data-i18n="docs_library">Documents</span>
                <h1 data-i18n="important_documents">Document Library</h1>
                <p class="muted">Browse and download guides, forms and PDF resources.</p>
            </div>
            <div id="docs-list" style="display:flex;flex-direction:column;gap:14px;"></div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/i18n.js"></script>
    <script>
        const API = window.HNC, L = window.HNC_LANG;
        const list = document.getElementById('docs-list');
        function human(s){const b=+s;if(b>=1048576)return (b/1048576).toFixed(1)+' MB';if(b>=1024)return (b/1024).toFixed(1)+' KB';return b+' B';}
        function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
        list.innerHTML = Array.from({length:3}).map(()=>'<div class="skeleton-card"><div class="skeleton skeleton-line" style="width:80%"></div><div class="skeleton skeleton-line"></div></div>').join('');
        async function load(search){
            const q = { limit: 100 };
            if(search) q.search = search;
            const res = await API.request('documents',{auth:false,query:q}).catch(()=>({data:[]}));
            const items = res.data || [];
            list.innerHTML = items.length ? items.map(d=>`
                <article class="card doc-row">
                    <div style="display:flex;gap:14px;align-items:center">
                        <span class="doc-icon">PDF</span>
                        <div><h3 style="margin:0">${esc(d.title)}</h3>
                        <p class="muted" style="margin:4px 0 0">${esc(d.category_name||'')} · v${esc(d.version||'1.0')} · ${human(d.file_size||0)} · ${esc(d.download_count||0)} downloads</p>
                        ${d.description?`<p class="muted" style="margin:4px 0 0;font-size:.85rem">${esc(d.description)}</p>`:''}</div>
                    </div>
                    <a class="btn btn-primary" href="${API.apiUrl('documents/'+d.id+'/download')}" data-i18n="download">Download</a>
                </article>`).join('') : '<div class="empty-state"><p>No documents found.</p></div>';
        }
        load();
        const input=document.getElementById('doc-search');let timer;
        input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>load(input.value.trim()),300);});
        document.querySelectorAll('[data-lang-btn]').forEach(b=>b.addEventListener('click',()=>L.setLang(b.getAttribute('data-lang-btn'))));
        document.getElementById('nav-toggle').addEventListener('click',()=>document.querySelector('.nav-links').classList.toggle('open'));
    </script>
</body>
</html>
