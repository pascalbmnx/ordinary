<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Drawing — HelpKonnect</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>form.form{display:grid;gap:18px}.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(max-width:640px){.form-row{grid-template-columns:1fr}}</style>
</head>
<body>
    <div class="toast-wrap" id="toast-wrap"></div>
    <header class="site-nav"><div class="container nav-inner">
        <a href="../index.html" class="brand" data-route="home"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0ea5e9"/><path d="M10 12h3v13h-3zM19 12h3v13h-3zM7 9h4v16H7zM21 9h4v16h-4z" fill="#0b2a4a"/></svg>HelpKonnect</a>
        <nav class="nav-links"><a href="../index.html" data-route="home" data-i18n="home">Home</a><a href="../index.html#services" data-route="services" data-i18n="services">Services</a><a href="documents.html" data-route="docs" data-i18n="docs_library">Documents</a><a href="faq.html" data-route="faq" data-i18n="faq">FAQ</a><a href="../index.html#contact" data-route="contact" data-i18n="contact">Contact</a></nav>
        <div class="nav-actions">
            <div class="lang-switch"><button data-lang-btn="en">EN</button><button data-lang-btn="sw">SW</button></div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        </div>
    </div></header>

    <main class="section">
        <div class="container" style="max-width:760px">
            <div class="section-head">
                <span class="tagline" data-i18n="request_drawing">Drawing</span>
                <h1>Request an Application Drawing</h1>
                <p class="muted">Tell us about the drawing you need. You will receive a reference number to track your request.</p>
            </div>

            <form class="card form" id="drawing-form" novalidate>
                <h3 style="margin:0">Applicant Information</h3>
                <div class="form-row">
                    <div class="form-group"><label>Full name <span class="req">*</span></label><input class="form-input" name="applicant_name" required></div>
                    <div class="form-group"><label>Phone <span class="req">*</span></label><input class="form-input" name="phone" placeholder="+255XXXXXXXXX" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Email</label><input class="form-input" name="email" type="email"></div>
                    <div class="form-group"><label>Property type</label>
                        <select class="form-select" name="property_type"><option value="">Select...</option><option>Residential</option><option>Commercial</option><option>Industrial</option><option>Institutional</option><option>Other</option></select>
                    </div>
                </div>

                <h3 style="margin:0;padding-top:8px">Drawing Information</h3>
                <div class="form-row">
                    <div class="form-group"><label>Electrical requirement</label><input class="form-input" name="electrical_requirement" placeholder="e.g. Single phase meter board"></div>
                    <div class="form-group"><label>Number of rooms</label><input class="form-input" name="number_of_rooms" type="number" min="1"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Estimated load (kW / A)</label><input class="form-input" name="estimated_load"></div>
                    <div class="form-group"><label>Location</label><input class="form-input" name="location"></div>
                </div>
                <div class="form-group"><label>Project description</label><textarea class="form-textarea" name="description"></textarea></div>
                <div class="form-group"><label>Additional instructions</label><textarea class="form-textarea" name="additional_instructions"></textarea></div>

                <div style="display:flex;gap:12px;align-items:center">
                    <button class="btn btn-primary" id="submit-drawing" type="submit">Submit Drawing Request</button>
                    <span class="muted" id="form-status" style="font-size:.85rem"></span>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/i18n.js"></script>
    <script>
        const API = window.HNC, L = window.HNC_LANG;
        function status(m){document.getElementById('form-status').textContent=m;}
        function toast(m,t){const w=document.getElementById('toast-wrap');const n=document.createElement('div');n.className='toast toast--'+(t||'success');n.textContent=m;w.appendChild(n);setTimeout(()=>n.classList.add('toast--show'),20);setTimeout(()=>{n.classList.remove('toast--show');setTimeout(()=>n.remove(),300);},3200);}
        document.getElementById('drawing-form').addEventListener('submit', async function(e){
            e.preventDefault();
            document.getElementById('submit-drawing').disabled = true;
            status(L.t('loading'));
            const fd = new FormData(this); const body = {};
            for(const [k,v] of fd.entries()) body[k]=v;
            try{
                const res = await API.request('drawings',{method:'POST',body});
                status('Submitted. Reference: '+res.data.reference_no);
                toast('Drawing request submitted. Reference: '+res.data.reference_no,'success');
            }catch(err){
                status(err.message);
                toast(err.message,'error');
                document.getElementById('submit-drawing').disabled=false;
            }
        });
        document.querySelectorAll('[data-lang-btn]').forEach(b=>b.addEventListener('click',()=>L.setLang(b.getAttribute('data-lang-btn'))));
        document.getElementById('nav-toggle').addEventListener('click',()=>document.querySelector('.nav-links').classList.toggle('open'));
    </script>
</body>
</html>
